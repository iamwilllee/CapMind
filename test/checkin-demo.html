<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapMind 测试页 · 模拟签到站点</title>
<style>
  body { margin: 0; padding: 40px 48px; background: #f7f7f5; color: #1b1a17;
         font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
  .sub { font-size: 13px; color: #6b6962; margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 26px; }
  .card { border: 1px solid #d6d4cb; background: #fff; padding: 16px 18px; }
  .card .label { font-size: 11px; color: #6b6962; }
  .card .num { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -.03em; }
  /* 这个框就是要圈选的区域 */
  .checkin { border: 1px solid #d6d4cb; background: #fff; padding: 20px 22px; width: 460px; }
  .checkin h2 { font-size: 14px; margin: 0 0 14px; }
  button { font: inherit; height: 44px; padding: 0 20px; border: 1px solid #1b1a17;
           background: #1b1a17; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #e4e2d9; color: #6b6962; border-color: #d6d4cb; cursor: default; }
  .meta { font-size: 11px; color: #6b6962; margin-top: 14px; }
  .status { margin-top: 14px; font-size: 12px; min-height: 18px; font-weight: 600; }
  .status.ok { color: #3f6b4a; }
  .tip { margin-top: 34px; border-left: 3px solid #b23a1f; padding: 10px 14px;
         background: #fff; font-size: 12px; line-height: 1.7; color: #514f49; }
  .milestone { margin-top: 22px; border: 1px solid #d6d4cb; background: #fff; padding: 16px 18px; width: 460px; font-size: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>模拟签到站点</h1>
  <div class="sub">CapMind 本地测试页 · 不需要登录 · 不会发任何网络请求</div>

  <div class="cards">
    <div class="card"><div class="label">今天还能领</div><div class="num">¥598</div></div>
    <div class="card"><div class="label">下次刷新</div><div class="num">11:56</div></div>
    <div class="card"><div class="label">连续签到</div><div class="num" id="streak">12 天</div></div>
  </div>

  <!-- 圈选这一块 -->
  <div class="checkin" id="checkin-box">
    <h2>每日签到</h2>
    <button type="button" id="checkin-btn" data-action="checkin">签到领额度</button>
    <div class="meta">今日额度 ¥598 · 每日 00:00 刷新</div>
    <div class="status" id="status"></div>
  </div>

  <div class="milestone" id="milestone-box">
    <strong>网站 ICP 备案</strong><br>
    ICP 备案审核一般 20 个工作日，通过后下发备案号。提交材料 → 接入商初审 → 管局审核 → 备案号下发。
  </div>

  <div class="tip">
    测试提示：拖拽框选上面的「每日签到」白框，然后点「识别这块 →」。<br>
    「试跑一次」会真的点一次按钮；再点「立即签到」应显示「今天已经领过，跳过」。<br>
    需要重来时，刷新本页即可重置状态。
  </div>
</div>

<script>
  var btn = document.getElementById('checkin-btn');
  var status = document.getElementById('status');
  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    btn.textContent = '今日已领取';
    btn.disabled = true;
    status.textContent = '领取成功 +100 积分';
    status.className = 'status ok';
  });
</script>
</body>
</html>
