name: Build and Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

  # 允许手动触发
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build extension
        run: |
          pnpm build
          pnpm zip
          pnpm zip:firefox

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/v${{ steps.package-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.package-version.outputs.tag }}
          name: CapMind v${{ steps.package-version.outputs.version }}
          body: |
            ## CapMind v${{ steps.package-version.outputs.version }}

            ### 功能
            - 圈选网页任意区域，本地识别生成可编辑的签到配方
            - 每日自动签到：按钮文案校验、已领判据、成功判据，失败才通知
            - 长周期事项：里程碑进度与定期回访提醒
            - 可选 AI 识别（用户自配端点），默认本地识别、无需 Key

            ### 说明
            - Manifest V3，使用 chrome.alarms 调度，Service Worker 启动即补领漏跑任务
            - 每日执行阶段不发起任何网络请求；数据仅存本机
            - 浏览器需保持打开，关机期间不执行，重开后补领

            ### 安装
            下载对应 zip，在扩展管理页开启开发者模式后「加载已解压的扩展程序」。
            正式发布请使用**同一个 Chrome Web Store 条目**上传，以保留扩展 ID。
          draft: false
          prerelease: false
          files: |
            .output/chrome-mv3.zip
            .output/firefox-mv2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Chrome Extension
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: capmind-chrome-v${{ steps.package-version.outputs.version }}
          path: .output/chrome-mv3.zip

      - name: Upload Firefox Extension
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: capmind-firefox-v${{ steps.package-version.outputs.version }}
          path: .output/firefox-mv2.zip
