<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>长周期事项详情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#b23a1f}a:hover{color:#8a2c17}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.display{font-family:"Space Grotesk",-apple-system,sans-serif;font-weight:700;letter-spacing:-0.05em}
.tl{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl:not(:last-child)::before{content:"";position:absolute;left:4px;top:13px;bottom:0;width:1px;background:var(--line)}
.dot{width:9px;height:9px;border:1.5px solid var(--ink3);background:var(--paper);flex:0 0 9px;margin-top:3px;z-index:1}
.log{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.55}
.tick{flex:1;border-left:2px solid var(--line);height:9px}
</style>
</helmet>
<div style="width:380px;height:840px;box-sizing:border-box;--ground:#F0F0ED;--paper:#FFFFFF;--ink:#1B1A17;--ink2:#514F49;--ink3:#6B6962;--line:#D6D4CB;--accent:{{accent}};--ok:#3F6B4A;--wait:#8A5A16;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)">

  <div style="height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:var(--paper)">
    <div style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      <span style="font-size:12px;font-weight:700;letter-spacing:0.08em">CAPMIND</span>
      <span class="mono" style="font-size:9px;color:var(--ink3)">v0.2</span>
    </div>
    <button aria-label="关闭侧边栏" style="width:44px;height:44px;display:grid;place-items:center;color:var(--ink3)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div style="height:44px;flex:0 0 44px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--paper)">
    <button style="flex:1;font-size:12px;font-weight:600;background:var(--ink);color:#ffffff">今日</button>
    <button style="flex:1;font-size:12px;color:var(--ink2);border-left:1px solid var(--line)">全部</button>
    <button style="flex:1;font-size:12px;color:var(--ink2);border-left:1px solid var(--line)">设置</button>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden">

    <div style="display:flex;align-items:center;gap:8px;padding:12px 16px 2px;font-size:10.5px;color:var(--ink3)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      返回事项
    </div>
    <div class="display" style="font-size:21px;padding:2px 16px 16px">网站 ICP 备案</div>

    <div style="margin:0 16px 20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="display" style="font-size:34px">2 / 4</span>
        <span class="mono" style="font-size:10px;color:var(--ink3)">第 14 / 30 天</span>
      </div>
      <div style="display:flex;align-items:flex-end;height:16px;margin-top:10px;border-bottom:1px solid var(--ink)">
        <i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--ink)"></i><i class="tick" style="border-left-color:var(--accent);height:15px"></i>
        <i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i><i class="tick"></i>
      </div>
      <div style="display:flex;justify-content:space-between" class="mono"><span style="font-size:9px;color:var(--ink3)">0</span><span style="font-size:9px;color:var(--ink3)">30 天</span></div>
    </div>

    <div style="padding:0 16px 4px;font-size:11px;font-weight:700">进度</div>
    <div style="padding:12px 16px 0">
      <div class="tl">
        <span class="dot" style="background:var(--ok);border-color:var(--ok)"></span>
        <div><div style="font-size:12px;font-weight:600">提交材料</div><div class="mono" style="font-size:10px;color:var(--ink3);margin-top:3px">10-31 完成</div></div>
      </div>
      <div class="tl">
        <span class="dot" style="background:var(--ok);border-color:var(--ok)"></span>
        <div><div style="font-size:12px;font-weight:600">接入商初审</div><div class="mono" style="font-size:10px;color:var(--ink3);margin-top:3px">11-04 完成</div></div>
      </div>
      <div class="tl">
        <span class="dot" style="background:var(--wait);border-color:var(--wait)"></span>
        <div><div style="font-size:12px;font-weight:700;color:var(--wait)">管局审核 · 待推进</div><div class="mono" style="font-size:10px;color:var(--ink3);margin-top:3px">已等待 9 天</div></div>
      </div>
      <div class="tl">
        <span class="dot"></span>
        <div><div style="font-size:12px;color:var(--ink3)">备案号下发</div><div class="mono" style="font-size:10px;color:var(--ink3);margin-top:3px">未开始</div></div>
      </div>
    </div>

    <div style="height:6px"></div>

    <div style="padding:0 16px;font-size:11px;font-weight:700">回访记录</div>
    <div style="padding:0 16px">
      <div class="log"><span class="mono" style="flex:0 0 46px;font-size:10px;color:var(--ink3)">11-06</span><span style="color:var(--ink2)"><b style="color:var(--ink)">推进了 1 步</b><br>初审通过，等待管局审核。</span></div>
      <div class="log"><span class="mono" style="flex:0 0 46px;font-size:10px;color:var(--ink3)">10-30</span><span style="color:var(--ink2)"><b style="color:var(--ink)">创建事项</b><br>预计 30 天，每 7 天回访一次。</span></div>
    </div>

  </div>

  <div style="height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 14px;border-top:1px solid var(--line);background:var(--paper)">
    <button style="flex:1;height:44px;background:var(--accent);color:#ffffff;font-size:12px;font-weight:600">标记完成</button>
    <button style="height:44px;padding:0 14px;border:1px solid var(--ink3);font-size:12px;color:var(--ink2)">延期一周</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B23A1F","options":["#B23A1F","#8A5A16","#3F6B4A"]},"$preview":{"width":380,"height":840}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#B23A1F' };
}
}
</script>
</body>
</html>
